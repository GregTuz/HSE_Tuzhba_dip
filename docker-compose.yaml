version: '3.8'

services:

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9094:9094"
    networks: [ data-network ]
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka
    networks: [data-network]

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d
    networks: [data-network]

  superset:
    image: apache/superset:3.1.0
    container_name: superset
    ports:
      - "8088:8088"
    depends_on:
      - clickhouse
    environment:
      - SUPERSET_SECRET_KEY=supersecretkey123
    volumes:
      - superset_data:/app/superset_home
    networks: [data-network]
    command: >
      bash -c "
      superset db upgrade &&
      superset fab create-admin
        --username admin
        --firstname Admin
        --lastname Admin
        --email admin@example.com
        --password admin || true &&
      superset init &&
      superset run -p 8088 --host 0.0.0.0
      "

  airflow-db:
    image: postgres:15
    container_name: airflow-db
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    networks: [data-network]
    volumes:
      - airflow_db_data:/var/lib/postgresql/data

  x-airflow-common: &airflow-common
    build: .
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__WEBSERVER__SECRET_KEY=my_super_secret_key_123
      - AIRFLOW__WEBSERVER__SHOW_TRIGGER_FORM_IF_NO_PARAMS=True
    volumes:
      - ./dags:/opt/airflow/dags
    networks: [data-network]

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    depends_on:
      - airflow-db
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com || true
      "

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    depends_on:
      - airflow-init
      - clickhouse
      - kafka
    ports:
      - "8081:8080"
    command: airflow webserver

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    depends_on:
      - airflow-init
      - clickhouse
      - kafka
    command: airflow scheduler

  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: jupyter
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_TOKEN=admin
    volumes:
      - ./notebooks:/home/jovyan/work
    working_dir: /home/jovyan/work
    command: start-notebook.sh --notebook-dir=/home/jovyan/work
    networks: [data-network]

  fastapi:
    build:
      context: ./fastapi_app
      dockerfile: Dockerfile
    container_name: fastapi_producer
    ports:
      - "8000:8000"
    volumes:
      - ./notebooks/Financial_Transactions_Enriched.csv:/app/data/Financial_Transactions_Enriched.csv:ro
    environment:
      - CSV_PATH=/app/data/Financial_Transactions_Enriched.csv
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=transactions
    depends_on:
      - kafka
    restart: unless-stopped
    networks: [data-network]

networks:
  data-network:
    driver: bridge

volumes:
  kafka_data:
  airflow_db_data:
  clickhouse_data:
  superset_data: